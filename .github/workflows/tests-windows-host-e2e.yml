name: Windows-host e2e (tailnet)

# Runs the live Windows-host integration suites (issue #864, split out of #561):
# computer/ssh-tunnel.e2e.test.ts and browser/drivers/ssh.e2e.test.ts drive the REAL
# remote runtime against win-mini over the tailnet — daemon push + scheduled
# task + ssh -L tunnel + JSON-RPC roundtrip, and the Edge-over-CDP browser path.
# They are env-gated on AGENTS_TEST_WIN_HOST and skip everywhere else.
#
# Runner: the `crabbox-ci` org runner pool (ci-runner-fsn1, Hetzner) — two
# persistent org-scoped runners labeled [crabbox-ci, tailnet], joined to the
# tailnet with fleet SSH reach to win-mini. The vitest setup file hermetically
# redirects AGENTS_DEVICES_DIR (RUSH-2042); the e2e seeder
# (cli/tests/seed-e2e-win-host.ts) copies win-mini from the real fleet
# registry or synthesizes it from `ssh -G win-mini` into that private dir so
# resolveRemoteDevice can dial. The pool is an org runner group restricted to
# agents-cli + agi-cli.
#
# LABEL RULE: `crabbox-ci` may only appear in workflows with trusted triggers
# (push to main / schedule / workflow_dispatch). Never on pull_request — this
# repo is public and the runner is self-hosted, so fork PRs must never execute
# code on it. This workflow deliberately has NO pull_request trigger. Keep it
# that way.
#
# Tool versions are NOT pinned here — setup-bun reads from package.json; dotnet
# matches computer-helper-win.yml (build-win.sh cross-publishes the win-x64
# daemon exe from the Linux runner via EnableWindowsTargeting).

on:
  push:
    branches: ['main']
    paths:
      - 'cli/src/lib/computer/ssh-tunnel.ts'
      - 'cli/src/lib/computer/ssh-tunnel.e2e.test.ts'
      - 'cli/src/lib/ssh-exec.ts'
      - 'cli/src/lib/computer/computer-rpc.ts'
      - 'cli/src/lib/browser/drivers/ssh.ts'
      - 'cli/src/lib/browser/drivers/ssh.e2e.test.ts'
      - 'native/computer-win/**'
      - '.github/workflows/tests-windows-host-e2e.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# One run at a time: the suite mutates real remote state on win-mini (scheduled
# task, helper exe, tunnel ports). Queue instead of cancel — a killed run could
# leave the remote half-torn-down.
concurrency:
  group: windows-host-e2e
  cancel-in-progress: false

jobs:
  win-host-e2e:
    # Belt-and-braces with the trigger list above: never run from a fork context.
    if: github.repository == 'phnx-labs/agi-cli'
    runs-on: [self-hosted, crabbox-ci, tailnet]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    env:
      AGENTS_TEST_WIN_HOST: win-mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # setup-dotnet defaults to /usr/share/dotnet, which needs root the hosted
      # runners have but this self-hosted (rootless, user-systemd) runner does
      # not. Point it at a user-writable, workspace-local dir. `runner.*` is not
      # available in job-level `env:`, so set it here via $RUNNER_TEMP -> the
      # install dir the next step's setup-dotnet reads (and adds to PATH).
      - name: Pick a user-writable dotnet install dir
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET (cross-publish the win-x64 daemon exe)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # computer/ssh-tunnel.e2e.test.ts pushes this exe to win-mini via scp before it
      # registers + starts the LOGON scheduled task.
      - name: Build Windows helper exe
        run: bash scripts/build-win.sh

      - name: Windows-host e2e suites
        run: bun run test -- src/lib/computer/ssh-tunnel.e2e.test.ts src/lib/browser/drivers/ssh.e2e.test.ts
