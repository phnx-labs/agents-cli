name: Tests

# Required per-PR correctness gate. A fast scope job classifies changed paths,
# then only the affected monorepo components consume runners. The final `test`
# job preserves the required-check context used by branch protection and the
# release script. CLI tests stay three-way sharded: the organization has a
# 20-job GitHub-hosted concurrency limit, so more shards make agent PR bursts
# slower even when an isolated PR finishes sooner.

on:
  pull_request:
    branches: ['main', 'release/**']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.scope.outputs.cli }}
      cli_docs: ${{ steps.scope.outputs.cli_docs }}
      ext: ${{ steps.scope.outputs.ext }}
      session_tracker: ${{ steps.scope.outputs.session_tracker }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Three-dot PR comparison needs the merge base. The checked-out PR
          # merge ref carries the fork head object; full history carries base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-scope.ts "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT"
      - name: Pin release-matrix trigger policy and .agents/ layout
        run: bun test ./.github/workflows/

  # Install once for type-checking, the compiled-binary smoke, and the gating
  # distributed-session benchmark. The old separate jobs repeated dependency
  # setup and consumed three runner slots while all finished before the shards.
  cli-preflight:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Verify the command index is up to date
        run: bash scripts/verify-command-index.sh
      - name: Type-check and build
        run: bun run build
      - name: Build the standalone binary
        run: bash scripts/build-bin.sh
      - name: Run the compiled binary
        run: |
          set -euo pipefail
          ver=$(./dist/bin/agents --version)
          echo "compiled binary version: $ver"
          [ -n "$ver" ] || { echo "::error::--version produced no output"; exit 1; }
          ./dist/bin/agents --help >/dev/null
          echo "compiled binary runs: version + help OK"
      - name: Guard distributed session-query performance
        run: bun bench/sessions-active-perf.ts

  cli-test-shard:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: node ./node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/3

  cli-docs:
    needs: scope
    if: needs.scope.outputs.cli_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-docs.sh
      - name: Verify the command index is up to date
        run: bash scripts/verify-command-index.sh

  ext:
    needs: scope
    if: needs.scope.outputs.ext == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/ext/ui
      - run: bun run compile

  session-tracker:
    needs: scope
    if: needs.scope.outputs.session_tracker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/session-tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The scenario suites launch installed coding harnesses and belong on the
      # fleet; this hosted lane exercises the package's deterministic parser.
      - run: bun run test -- tests/state-file.test.ts

  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Smoke only — path/hooks/shims. Linux shards own the full suite.
      # A full unsharded `bun run test` on windows-latest is ~21 minutes
      # (855 files, no --shard) and was restarting on every push, so PRs
      # sat on the required `test` aggregator for hours. RUSH-2215's full
      # Windows suite lives in #2707, not this required PR gate.
      - run: bun run test -- src/lib/platform src/lib/hooks src/lib/binary-shadow.test.ts src/lib/shims.test.ts src/lib/shims.device-pins.test.ts

  test:
    needs: [scope, cli-preflight, cli-test-shard, cli-docs, ext, session-tracker, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate every affected component
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CLI_EXPECTED: ${{ needs.scope.outputs.cli }}
          CLI_PREFLIGHT_RESULT: ${{ needs.cli-preflight.result }}
          CLI_TEST_RESULT: ${{ needs.cli-test-shard.result }}
          DOCS_EXPECTED: ${{ needs.scope.outputs.cli_docs }}
          DOCS_RESULT: ${{ needs.cli-docs.result }}
          EXT_EXPECTED: ${{ needs.scope.outputs.ext }}
          EXT_RESULT: ${{ needs.ext.result }}
          SESSION_TRACKER_EXPECTED: ${{ needs.scope.outputs.session_tracker }}
          SESSION_TRACKER_RESULT: ${{ needs.session-tracker.result }}
          WINDOWS_EXPECTED: ${{ needs.scope.outputs.windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::scope classification finished as $SCOPE_RESULT"
            exit 1
          fi

          check_result() {
            local name="$1" expected="$2" result="$3"
            echo "$name: expected=$expected result=$result"
            if [ "$expected" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$name was required but finished as $result"
              return 1
            fi
            if [ "$expected" != "true" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name was not required but finished as $result"
              return 1
            fi
          }

          check_result "cli-preflight" "$CLI_EXPECTED" "$CLI_PREFLIGHT_RESULT"
          check_result "cli-test-shard" "$CLI_EXPECTED" "$CLI_TEST_RESULT"
          check_result "cli-docs" "$DOCS_EXPECTED" "$DOCS_RESULT"
          check_result "ext" "$EXT_EXPECTED" "$EXT_RESULT"
          check_result "session-tracker" "$SESSION_TRACKER_EXPECTED" "$SESSION_TRACKER_RESULT"
          check_result "windows" "$WINDOWS_EXPECTED" "$WINDOWS_RESULT"
          echo "all affected component checks green"
