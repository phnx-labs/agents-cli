name: Tests

# Per-PR test gate on GitHub-hosted Linux runners. One of the two required checks
# (with gitleaks). The suite is split three ways with `vitest --shard` and run in
# parallel, with type-checking as its own parallel job; a small aggregate `test`
# job gates on all of them so the required-check context stays named `test`
# (branch protection + scripts/release.sh EXPECTED_CHECKS depend on that name --
# don't rename it). The full cross-platform matrix lives in ci.yml, cost-gated to
# release/** branches and v* tags.
#
# Tool versions are NOT pinned here -- setup-bun reads them from package.json.

on:
  pull_request:
    branches: ['main', 'release/**']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-check (via build) in parallel with the test shards. No test imports from
  # dist/, so the build never needed to precede the suite -- pulling it onto its
  # own lane takes it off the test critical path while still gating types.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('apps/cli/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # The suite, split three ways. Each shard runs a disjoint third of the test
  # files on its own runner; fail-fast is off so one failing shard doesn't cancel
  # the others (you see every failure in one run).
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('apps/cli/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: node ./node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/3

  # Verify docs stay internally consistent (no broken relative links, cheat sheet
  # present, entry points wired). Cheap and fast; keeps the agent-facing docs from
  # drifting silently.
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/verify-docs.sh

  # Aggregate gate: the ONLY required-check context here. Runs after typecheck,
  # every shard, and docs verification regardless of their outcome (`if: always()`)
  # and fails unless ALL succeeded -- so a type error, shard failure, or docs drift
  # still blocks the merge through this single `test` check. A matrix job's `result`
  # is `success` only when every leg passed.
  test:
    needs: [typecheck, test-shard, verify-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on typecheck + all test shards + docs
        run: |
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "test-shard:  ${{ needs.test-shard.result }}"
          echo "verify-docs: ${{ needs.verify-docs.result }}"
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::typecheck failed"; exit 1
          fi
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "::error::one or more test shards failed"; exit 1
          fi
          if [ "${{ needs.verify-docs.result }}" != "success" ]; then
            echo "::error::docs verification failed"; exit 1
          fi
          echo "typecheck + all shards + docs green"

  # Smoke-test the COMPILED standalone binary (`bun build --compile`), which the
  # vitest suite never exercises: on the Bun standalone, process.argv[1] /
  # process.execPath are the virtual embedded entry (/$bunfs/root/agents), not a
  # real path -- so an argv-shape regression (e.g. the ssh askpass shim) can pass
  # every unit test yet break the shipped binary. Build it on Linux and confirm it
  # actually runs. NOT wired into the required `test` aggregate -- this is a
  # standalone, non-required check for now; promote it once it has proven stable.
  compiled-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('apps/cli/bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build the standalone binary
        run: bash scripts/build-bin.sh
      - name: Run the compiled binary (argv/execPath must resolve on /$bunfs)
        run: |
          set -euo pipefail
          ver=$(./dist/bin/agents --version)
          echo "compiled binary version: $ver"
          [ -n "$ver" ] || { echo "::error::--version produced no output"; exit 1; }
          # Exercises command routing on the standalone (the class of bug that only
          # surfaces on the compiled binary, e.g. 'unknown command /$bunfs/...').
          ./dist/bin/agents --help >/dev/null
          echo "compiled binary runs: version + help OK"
